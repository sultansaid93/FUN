   All artwork is inline CSS/SVG; no internet, libraries or fonts required.

:root{
  --red:#ca233c; --red-dark:#801e35; --red-light:#fff0f0;
  --green:#00885d; --green-dark:#064e40; --green-light:#dff9ec;
  --gold:#ffce77; --ink:#14362f; --muted:#687d76;
  --cream:#f9fbf6; --line:#d5e4db; --panel:#ffffff;
  --shadow:0 18px 44px rgba(0,43,34,.14); --radius:24px;
  --night:#051e27;
}
html{scroll-behavior:smooth}
body{
  background:radial-gradient(ellipse at 5% 4%,#143c40 0%,transparent 27%),
    radial-gradient(ellipse at 97% 6%,#5d1e33 0%,transparent 26%),
    radial-gradient(ellipse at 50% 94%,#094b45 0%,transparent 45%),
    linear-gradient(130deg,#092d30,#061d27 48%,#102c32 100%);
  background-attachment:fixed;color:#f5fff9;
  font-family:"Noto Sans Arabic","Tajawal","Cairo",Tahoma,"Segoe UI",sans-serif;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.24;
  background-image:radial-gradient(circle,#fce6bb 1px,transparent 1.7px);
  background-size:44px 44px;
  mask-image:linear-gradient(180deg,#0003,transparent 65%);
}
.scene-ambient{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.scene-glow{position:absolute;display:block;border-radius:50%;filter:blur(3px);opacity:.7;
  animation:amb-drift 24s ease-in-out infinite alternate}
.scene-glow.a{width:42vw;height:42vw;max-width:650px;max-height:650px;right:-16vw;top:13vh;
  background:radial-gradient(circle,#d41c373c 0%,#ed2d2011 45%,transparent 71%)}
.scene-glow.b{width:39vw;height:39vw;max-width:600px;max-height:600px;left:-15vw;top:32vh;
  background:radial-gradient(circle,#22ad8644 0%,#23ad8614 47%,transparent 71%);animation-delay:-13s}
.scene-ring{position:absolute;width:290px;height:290px;border:1px solid #ffffff13;
  border-radius:30%;transform:rotate(35deg);animation:amb-spin 52s linear infinite}
.scene-ring.a{top:22%;left:-130px}.scene-ring.b{bottom:-165px;right:10%;width:380px;height:380px;animation-direction:reverse}
.scene-spark{position:absolute;color:#fbdca0;opacity:.34;font-size:21px;animation:amb-spark 4.5s ease-in-out infinite}
.scene-spark.a{top:15%;left:9%}.scene-spark.b{top:48%;right:5%;font-size:31px;animation-delay:-1.9s}
.scene-spark.c{bottom:8%;left:28%;font-size:15px;animation-delay:-3s}
@keyframes amb-drift{to{transform:translate3d(42px,-38px,0) scale(1.12)}}
@keyframes amb-spin{to{transform:rotate(395deg)}}
@keyframes amb-spark{0%,100%{opacity:.17;transform:scale(.7) rotate(-13deg)}50%{opacity:.74;transform:scale(1.25) rotate(25deg)}}
.flag-ribbon{height:8px;background:linear-gradient(to left,#c91c36 0 31%,#fff 31% 65%,#07885b 65% 100%);
  box-shadow:0 3px 20px #070c1166}
.decor{display:none}
#app{max-width:1740px;padding:21px clamp(14px,3vw,48px) 40px}
.masthead{margin:6px 0 21px;padding:12px 6px 17px;border-bottom:1px solid #ffffff1a}
.brand{gap:14px}
.brand .eyebrow{color:#f9d69b;font-weight:950;font-size:11px;letter-spacing:2.1px}
.brand h1{color:#fff;font-size:clamp(23px,2.45vw,37px);text-shadow:0 5px 22px #0005}
.brand h1 b{color:#ffb9a4}
.flag-symbol{width:70px;height:70px;border:1px solid #ffffff73;border-radius:21px;
  background:linear-gradient(140deg,#ffffff25,#ffffff09);
  box-shadow:0 0 0 5px #ffffff09,0 9px 28px #0005;font-size:41px;
  animation:flag-levitate 5s ease-in-out infinite}
@keyframes flag-levitate{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(4deg)}}
.actions{gap:9px}
.btn{background:#ffffff;border:1px solid #dcece3;border-radius:15px;color:#143d32;
  font-weight:900;letter-spacing:0;font-size:13px;padding:12px 17px;
  box-shadow:0 3px 0 #0a151220;
  transition:transform .2s cubic-bezier(.2,.7,.1,1.4),box-shadow .2s,background .2s,border-color .2s,filter .2s}
.btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 10px 25px #0003;filter:saturate(1.16)}
.btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn.primary{background:linear-gradient(125deg,#f04757,#ae1636);border-color:#ff6d76;color:white;
  box-shadow:0 9px 28px #bf183633}
.btn.green{background:linear-gradient(125deg,#19b77f,#087a57);border-color:#32dc9c;color:#fff;
  box-shadow:0 8px 24px #0a7b5933}
.btn.gold{background:linear-gradient(125deg,#ffe6a8,#ffc255);border-color:#fff3c8;color:#56300d}
.btn.negative{background:linear-gradient(120deg,#585c68,#2c3542);border-color:#68717b;color:#fff}
.btn.soft{background:#ffffff13;border-color:#ffffff39;color:#fff;backdrop-filter:blur(12px)}
.btn.ghost{color:#eefff9;background:#ffffff09;border-color:#ffffff1b}
.btn.outline-danger{background:#fff2f1;color:#a51c3b;border-color:#f5bfc8}
.btn.big{font-size:18px;padding:17px 23px;border-radius:17px}
.btn:focus-visible,.q-tile:focus-visible,.choose-team:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.hero{border-radius:30px;background:
  radial-gradient(ellipse at 72% 24%,#f25e5350 0%,transparent 38%),
  linear-gradient(119deg,#9d1235 0%,#ce2943 43%,#9b1938 73%,#560b29 100%);
  box-shadow:0 25px 64px #070c1570,0 1px 0 #ffffff43 inset;
  border:1px solid #ffb9b044;min-height:270px;isolation:isolate}
.hero:before{width:640px;height:640px;border:1px solid #ffffff22;left:-140px;top:-380px;
  box-shadow:0 0 0 42px #ffffff08,0 0 0 87px #ffffff06;animation:hero-rotate 38s linear infinite}
.hero:after{width:640px;height:640px;right:-230px;bottom:-520px;border:1px dashed #ffe1ad46;opacity:.7}
@keyframes hero-rotate{to{transform:rotate(360deg)}}
.hero-inner{padding:28px clamp(20px,3.3vw,50px);gap:0;min-height:270px}
.hero-inner>div:first-child{position:relative;z-index:2;flex:1;max-width:740px}
.hero-sub{color:#ffe09b;letter-spacing:3px;font-size:12px;font-weight:950}
.hero h2{font-size:clamp(34px,3.8vw,61px);margin:9px 0 8px;letter-spacing:0;color:#fff;text-shadow:0 7px 25px #45111e88}
.hero p{font-size:clamp(13px,1.2vw,18px);color:#ffeff0;max-width:700px;font-weight:700;line-height:2}
.hero .pill{background:#fffefa22;border:1px solid #fffac276;color:#fff9e8;
  backdrop-filter:blur(5px);font-size:12px;font-weight:850;padding:9px 16px;
  box-shadow:0 4px 16px #0002}
.hero-visual{width:min(40%,500px);height:257px;position:relative;flex:0 0 auto;align-self:flex-end;overflow:visible}
.hero-visual .hero-halo{position:absolute;inset:5px 20% auto;width:225px;height:225px;
  border-radius:50%;background:radial-gradient(circle,#ffdb9c9c,#ffdb9c29 45%,transparent 68%);
  animation:hero-halo 5s ease-in-out infinite}
@keyframes hero-halo{50%{transform:scale(1.14);opacity:.7}}
.hero-landscape{position:absolute;bottom:-28px;right:-28px;width:112%;height:100%;overflow:visible;
  filter:drop-shadow(0 12px 15px #48112558)}
.hero-landscape .mtn{animation:landscape-rise 6s ease-in-out infinite alternate}
.hero-landscape .mtn.far{animation-delay:-3s}
@keyframes landscape-rise{to{transform:translateY(-6px)}}
.hero-icon{position:absolute;top:18px;right:21%;transform:rotate(-9deg);font-size:clamp(58px,6vw,100px);
  line-height:1;filter:drop-shadow(0 13px 14px #0005);animation:hero-flag 5.5s ease-in-out infinite}
@keyframes hero-flag{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-12px) rotate(7deg)}}
.hero-sparkle{position:absolute;color:#ffdf96;font-size:35px;filter:drop-shadow(0 0 9px #f5af5c);animation:amb-spark 3s ease-in-out infinite}
.hero-sparkle.first{top:12px;left:25%}.hero-sparkle.second{top:102px;right:6%;font-size:22px;animation-delay:-1.3s}
.hero-sparkle.third{top:88px;left:15%;font-size:18px;animation-delay:-2.2s}
.section-title{color:#fff;margin:22px 2px 16px;font-size:clamp(19px,1.6vw,26px)}
.section-title small{color:#cee8dc;font-size:12px}
.card{background:linear-gradient(160deg,#fff,#f5fcf8);border:1px solid #ffffff99;box-shadow:0 24px 65px #0004}
.setup-layout{gap:19px;margin-top:22px;grid-template-columns:minmax(0,1.4fr) minmax(320px,.60fr)}
.setup-card{padding:clamp(19px,2.6vw,35px);color:var(--ink);position:relative;overflow:hidden}
.setup-card:before{content:"";position:absolute;inset:0 0 auto;height:7px;background:linear-gradient(to left,#d41f3d 0 33%,#fff 33% 66%,#079666 66%)}
.setup-heading{font-size:clamp(24px,2vw,31px);color:#0b684e}
.lead{color:#57776c;font-size:15px}
.field-label{color:#204f42;margin:18px 0 9px}
.count-bubble{background:linear-gradient(135deg,#eb3150,#a91738);color:#fff;box-shadow:0 8px 17px #dd274133}
.range{accent-color:#bf1a3b;height:7px}
.name-box{border:1.5px solid #d6e8dc;background:linear-gradient(120deg,#fff,#f3fbf6);
  box-shadow:0 3px 11px #0552380b;transition:border-color .2s,box-shadow .2s,transform .2s}
.name-box:focus-within{border-color:#0fb47a;box-shadow:0 0 0 4px #19b87c1d;transform:translateY(-1px)}
.name-index{background:linear-gradient(135deg,#0e9d6c,#056e50);color:#fff;border-radius:11px}
.name-box input{color:#123e34}
.select{border:1.5px solid #d0e6d9;background:#fafffc;color:#184c3d;min-height:53px}
.setup-note{position:relative;overflow:hidden;background:
  radial-gradient(circle at 90% 4%,#38af8059,transparent 26%),
  linear-gradient(142deg,#0f6556 0%,#09372f 100%);border:1px solid #ffffff40;
  box-shadow:0 23px 44px #020b0844;color:#f0fff8;padding:25px;line-height:2}
.setup-note:before{content:"";position:absolute;width:210px;height:210px;left:-115px;bottom:-130px;border:25px solid #ffffff12;border-radius:50%}
.setup-note h3{color:#fff;font-size:24px}
.setup-note .howto{position:relative;color:#effff9;font-size:14px;font-weight:600}
.setup-note .howto li::marker{color:#ffcc78;font-weight:900}
.setup-note .rule-icon{font-size:92px;margin:7px 0;filter:drop-shadow(0 14px 10px #0004);animation:trophy-float 4s ease-in-out infinite}
@keyframes trophy-float{50%{transform:translateY(-10px) rotate(7deg)}}
.note-badge{background:#ffe8b7;color:#82441b;border:1px solid #ffda8a}
.setup-note p{color:#eefff7}
.saved-hint{color:#7b9689;font-weight:800}
.score-strip{gap:12px;margin:17px 0 23px;grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}
.team-score{background:linear-gradient(147deg,#fcfffc,#e9faf0 100%);border:1px solid #ffffffa8;
  border-radius:18px;padding:13px 15px 17px;box-shadow:0 8px 25px #0003;
  color:var(--ink);transition:transform .25s,box-shadow .25s;animation:card-enter .48s both}
.team-score:hover{transform:translateY(-4px);box-shadow:0 14px 30px #0004}
.team-score:before{width:6px;background:linear-gradient(#0cab71,#086d56)}
.team-score:nth-child(3n+2){background:linear-gradient(150deg,#fffdfc,#fff1f2)}
.team-score:nth-child(3n+2):before{background:linear-gradient(#ea3d59,#ab1938)}
.team-score:nth-child(3n){background:linear-gradient(150deg,#fffefb,#fff6e6)}
.team-score:nth-child(3n):before{background:linear-gradient(#f6b54b,#ba7c27)}
.team-score.first{border-color:#ffdb84;background:linear-gradient(145deg,#fff6d7,#fffefa);
  box-shadow:0 6px 0 #ffcb6a22,0 12px 27px #0003}
.team-score.first:before{background:linear-gradient(#ffe6a3,#d79419)}
.team-score .tname{font-size:12px;min-height:36px;color:#31584c;position:relative;z-index:1}
.team-score .team-n{color:#ba2943}
.team-score .tscore{font-size:clamp(24px,2.6vw,33px);color:#075943;font-weight:950;position:relative;z-index:1}
.team-score .tscore small{font-size:11px;color:#65796d}
.team-score .score-meter{height:5px;border-radius:10px;background:#dcece2;display:block;margin-top:9px;overflow:hidden}
.team-score .score-meter i{display:block;height:100%;border-radius:10px;width:var(--score-width,0%);
  background:linear-gradient(90deg,#e8465c,#f4ca67,#13a673);transition:width .6s}
.board-stats{gap:10px;margin:20px 0 12px}
.stat-pill{color:#ffffff;font-size:13px;font-weight:850;border:1px solid #ffffff2e;
  background:linear-gradient(130deg,#ffffff22,#ffffff0a);box-shadow:0 5px 15px #0002;
  backdrop-filter:blur(8px);padding:10px 16px}
.stat-pill b{font-size:18px;color:#ffe092}
.progress{background:#ffffff25;height:13px;box-shadow:0 1px 4px #0004 inset}
.progress>span{background:linear-gradient(90deg,#ce2340 0%,#ffdf90 53%,#10a47a 100%);
  background-size:180% 100%;animation:progress-gleam 6s linear infinite;transition:width .55s}
@keyframes progress-gleam{to{background-position:180% 0}}
.board-grid{gap:14px}
.category-card{--accent:#c91e3e;--deep:#6b122f;--tint:#fff0f2;
  padding:11px;border:1px solid #ffffffa8;background:linear-gradient(180deg,#ffffff 0%,#f3faf6 100%);
  box-shadow:0 15px 32px #0003;border-radius:22px;min-width:0;
  transition:transform .25s cubic-bezier(.19,.73,.23,1.35),box-shadow .25s;
  animation:card-enter .48s both}
.category-card:nth-child(2){animation-delay:.07s}.category-card:nth-child(3){animation-delay:.14s}
.category-card:nth-child(4){animation-delay:.21s}.category-card:nth-child(5){animation-delay:.28s}
.category-card:nth-child(6){animation-delay:.35s}
.category-card.green{--accent:#0c9668;--deep:#07513d;--tint:#e8fff2}
.category-card.gold{--accent:#bd7b25;--deep:#7c4b19;--tint:#fff5dd}
.category-card:hover{transform:translateY(-6px);box-shadow:0 21px 38px #0005}
.category-banner,.category-banner.green,.category-banner.gold{
  position:relative;isolation:isolate;overflow:hidden;border-radius:15px;min-height:142px;
  background:linear-gradient(135deg,var(--accent),var(--deep));margin-bottom:11px;color:white;
  border:1px solid #ffffff40;box-shadow:0 8px 20px #071e1b22}
.category-banner:before{content:"";position:absolute;inset:-70px -30px auto auto;width:180px;height:180px;
  border:25px solid #ffffff10;border-radius:50%;z-index:-1;animation:amb-spin 28s linear infinite}
.category-banner:after{content:"";position:absolute;inset:auto -6px -25px auto;width:110px;height:95px;
  border:1px dashed #fff8;transform:rotate(30deg);border-radius:28px;z-index:-1}
.category-banner .emoji{font-size:37px;line-height:1.2;filter:drop-shadow(0 8px 9px #0004);
  animation:category-float 3.5s ease-in-out infinite}
@keyframes category-float{50%{transform:translateY(-5px) rotate(9deg)}}
.category-card:nth-child(even) .category-banner .emoji{animation-delay:-1.7s}
.category-banner h3,.category-banner.green h3,.category-banner.gold h3{
  font-size:clamp(15px,1.29vw,22px);line-height:1.35;margin:6px 0 2px;color:#fff;text-shadow:0 3px 6px #0005}
.category-banner p{color:#fff4df;font-weight:750;line-height:1.65;font-size:10px}
.question-tiles{gap:7px}
.q-tile,.category-card.green .q-tile,.category-card.gold .q-tile{
  position:relative;isolation:isolate;background:linear-gradient(165deg,#fff,var(--tint));
  border:1.5px solid color-mix(in srgb,var(--accent),#fff 62%);color:var(--accent);
  border-radius:12px;height:55px;font-size:23px;font-weight:950;
  box-shadow:0 3px 0 color-mix(in srgb,var(--accent),#fff 83%);
  transition:transform .18s cubic-bezier(.2,.9,.2,1.4),box-shadow .18s,background .18s,color .18s,border-color .18s}
.q-tile:before{content:"";position:absolute;inset:0;border-radius:10px;
  background:linear-gradient(135deg,#fff8,transparent 46%);pointer-events:none}
.q-tile:hover:not(:disabled),.category-card.green .q-tile:hover:not(:disabled),.category-card.gold .q-tile:hover:not(:disabled){
  background:linear-gradient(145deg,var(--accent),var(--deep));border-color:var(--accent);
  box-shadow:0 10px 18px color-mix(in srgb,var(--accent),transparent 68%);color:#fff;
  transform:translateY(-4px) scale(1.045)}
.q-tile:active:not(:disabled){transform:translateY(0) scale(.98)}
.q-tile.used,.category-card.green .q-tile.used,.category-card.gold .q-tile.used,
.q-tile.used:hover,.category-card.green .q-tile.used:hover,.category-card.gold .q-tile.used:hover{
  background:linear-gradient(155deg,#e9eceb,#d3d8d6);border-color:#c4cdca;color:#788580;
  box-shadow:inset 0 2px 6px #8b98991f;opacity:1;transform:none;filter:saturate(0)}
.q-tile.used:after{color:#63786e;top:3px;left:7px;font-weight:950}
.resume{background:linear-gradient(125deg,#fff7e8,#fff1cb);color:#6b3f20;border:1px solid #ffd391;
  box-shadow:0 8px 26px #0002;border-radius:18px}
.stage{background:
  radial-gradient(ellipse at 50% 6%,#2389757a 0%,transparent 50%),
  radial-gradient(circle at 91% 78%,#b3183866 0%,transparent 35%),
  linear-gradient(145deg,#0c5b4c 0%,#073e37 39%,#082a2d 80%,#10353d 100%);
  border:1px solid #46b99373;border-radius:31px;
  box-shadow:0 26px 75px #0007,0 1px 0 #ffffff35 inset;min-height:620px;
  padding:clamp(22px,3vw,44px);animation:scene-enter .45s both;isolation:isolate}
.stage:before{opacity:.16;background-image:radial-gradient(circle,#fff 1px,transparent 1.5px);
  background-size:30px 30px;mask-image:linear-gradient(180deg,#000,transparent 80%)}
.stage:after{content:"";position:absolute;pointer-events:none;inset:auto -75px -175px auto;
  width:450px;height:450px;border:1px solid #ffffff22;border-radius:50%;z-index:0;
  box-shadow:0 0 0 47px #ffffff08,0 0 0 94px #ffffff06;animation:hero-rotate 42s linear infinite}
.stage-top{gap:15px}.stage-chip{background:#ffffff1a;border:1px solid #ffffff60;
  backdrop-filter:blur(6px);color:#fff;box-shadow:0 6px 17px #0002;font-weight:900}
.stage-team{background:linear-gradient(130deg,#ffe6aa,#ffbf55);color:#614019;
  border:1px solid #fff6d2;box-shadow:0 5px 20px #ffce6540}
.stage-body{margin-top:20px}
.stage-overline{color:#ffda8d;letter-spacing:1px;font-size:14px}
.stage-question{max-width:1080px;font-size:clamp(31px,3.35vw,55px);font-weight:950;
  line-height:1.8;margin:15px auto 14px;text-shadow:0 8px 16px #0004;animation:question-enter .5s ease-out both}
.visual-clue{display:inline-block;font-size:clamp(63px,7vw,120px);filter:drop-shadow(0 10px 20px #0006);
  animation:category-float 4s ease-in-out infinite}
.hint{color:#f2e3aa;font-size:16px}
.stage-status{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:clamp(15px,1.7vw,20px);color:#faffff;
  padding:12px 19px;border:1px solid #ffffff2c;border-radius:100px;
  background:#ffffff0e;box-shadow:0 8px 20px #0002;margin:13px auto 8px}
.timer-wrap{margin:22px 0 18px;perspective:800px}
.timer-circle{width:clamp(168px,18vw,220px);height:clamp(168px,18vw,220px);
  border-radius:50%;filter:drop-shadow(0 15px 26px #0006);isolation:isolate}
.timer-circle:before{content:"";position:absolute;inset:-13px;border-radius:50%;z-index:-1;
  border:2px solid #fbd69b77;box-shadow:0 0 0 8px #ffffff09,0 0 45px #edc16b50;
  animation:timer-breath 4s ease-in-out infinite}
.timer-circle:after{content:"";position:absolute;inset:10px;z-index:-1;border-radius:50%;
  background:radial-gradient(circle at 48% 38%,#115f4e,#082f2d 64%,#041e26 100%);
  border:1px solid #ffffff30;box-shadow:inset 0 0 35px #05251e,0 10px 36px #0004}
.timer-circle svg{position:relative;z-index:1;overflow:visible;transform:rotate(-90deg)}
.timer-circle .track{stroke:#ffffff24;stroke-width:8}
.timer-circle .timer-ticks{stroke:#f7d5a850;stroke-width:2;fill:none;stroke-dasharray:1 7.8}
.timer-circle .bar{stroke:#ffce7a;stroke-width:10;stroke-linecap:round;
  filter:drop-shadow(0 0 5px #ffd18c)}
.timer-circle .inner-ring{stroke:#ffffff20;stroke-width:1.5;fill:none;stroke-dasharray:3 7}
.timer-rotor{position:absolute;inset:-24px;border:1px dashed #e2cb8c66;border-radius:50%;
  animation:amb-spin 30s linear infinite;pointer-events:none}
.timer-rotor:after{content:"✦";position:absolute;top:-10px;left:48%;font-size:17px;color:#ffdfaa}
.timer-digit{z-index:2;color:#fff;text-shadow:0 6px 12px #0007}
.timer-digit strong{font-size:clamp(52px,6vw,72px);letter-spacing:-2px;font-weight:950;
  font-variant-numeric:tabular-nums;line-height:1.3}
.timer-digit span{font-size:14px;color:#ffe4ab;font-weight:900}
.timer-circle.danger:before{border-color:#ff5e77;box-shadow:0 0 0 9px #cf163729,0 0 50px #ff1d5480;
  animation:timer-danger .73s ease-in-out infinite alternate}
.timer-circle.danger .bar{stroke:#ff4b68;filter:drop-shadow(0 0 6px #ff4b68)}
.timer-circle.danger .timer-digit strong{color:#ffb7c4}
@keyframes timer-breath{50%{box-shadow:0 0 0 14px #ffffff0c,0 0 65px #edc16b7b}}
@keyframes timer-danger{to{transform:scale(1.055);opacity:.55}}
.expired-banner{background:linear-gradient(125deg,#fff5e1,#ffd3d9);color:#9b1837;
  box-shadow:0 0 0 6px #ff435927,0 11px 28px #0005;
  border:2px solid #fff;border-radius:18px;animation:expired-pop .45s both}
@keyframes expired-pop{0%{transform:scale(.8);opacity:0}75%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.stage-foot{margin-top:28px;gap:11px}
.stage .btn{border-color:#ffffff55}
.stage .btn.green{background:linear-gradient(125deg,#21be85,#068658);border-color:#72e9b3}
.stage .btn.negative{background:linear-gradient(125deg,#64717a,#303846)}
.stage .btn.ghost{background:#ffffff12;color:#fff;border-color:#ffffff30}
.answer-box{background:linear-gradient(153deg,#fff,#f0fff8 84%);color:#0f5743;
  border:2px solid #ffcf76;box-shadow:0 0 0 7px #f4c96e1d,0 23px 55px #0004;
  padding:clamp(20px,2.6vw,31px);animation:answer-reveal .5s cubic-bezier(.18,.74,.25,1.1) both}
.answer-box small{font-size:15px;color:#9a6121}
.answer-box .answer-value{color:#087454;font-weight:950;line-height:1.7;text-wrap:balance}
.answer-box p{color:#526c60;font-size:15px}
.answer-box .source-link{color:#ba1d3b}
@keyframes answer-reveal{0%{opacity:0;transform:translateY(20px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
.judge-title{font-size:clamp(16px,1.8vw,23px);color:#ffedc0}
.winner-stage{background:radial-gradient(ellipse at 50% 10%,#d49d4960,transparent 44%),
  linear-gradient(128deg,#064d3d,#072b2a 57%,#641e34 105%)}
.winner-stage .trophy{font-size:110px;filter:drop-shadow(0 17px 18px #0007);
  animation:trophy-win 2.5s ease-in-out infinite}
@keyframes trophy-win{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(5deg) translateY(-15px)}}
.winner-item{background:linear-gradient(135deg,#ffffff24,#ffffff0b);border:1px solid #ffffff4c;
  box-shadow:inset 0 1px 0 #ffffff31,0 10px 20px #0002;
  backdrop-filter:blur(8px);animation:card-enter .5s both}
.winner-item:nth-child(1){border-color:#ffe4a0;background:linear-gradient(130deg,#f4b95f66,#ffffff18)}
.winner-item:nth-child(2){animation-delay:.06s}.winner-item:nth-child(3){animation-delay:.12s}
.winner-item .points{color:#ffe2a4}
.results-badge{background:#ffffff20;border:1px solid #ffe0a184;box-shadow:0 8px 18px #0004}
.modal-backdrop{background:#051b22c9;backdrop-filter:blur(14px);animation:overlay-in .22s ease-out both}
.modal-card{color:#143b30;background:linear-gradient(140deg,#fff,#f3fff8);
  border:2px solid #fff;border-radius:29px;box-shadow:0 42px 100px #0009;

<script id="access-gate-script">
(function(){
  'use strict';
  const gate=document.getElementById('access-gate');
  const input=document.getElementById('access-password');
  const form=document.getElementById('access-form');
  const error=document.getElementById('access-error');
  const toggle=document.getElementById('access-toggle');
  // Client-side password gate for a public static site (not server-side authentication).
  const code='oman2040';
  form.addEventListener('submit',function(e){
    e.preventDefault();
    if(input.value===code){
      error.textContent='';
      document.body.classList.remove('access-locked');
      gate.remove();
      const game=document.getElementById('app');
      if(game) game.removeAttribute('aria-hidden');
      return;
    }
    gate.classList.remove('failed');
    void gate.offsetWidth;
    gate.classList.add('failed');
    error.textContent='كلمة المرور غير صحيحة. حاول مرة أخرى.';
    input.value='';
    input.focus();
  });
  toggle.addEventListener('click',function(){
    const show=input.type==='password';
    input.type=show?'text':'password';
    toggle.textContent=show?'إخفاء':'إظهار';
    toggle.setAttribute('aria-label',show?'إخفاء كلمة المرور':'إظهار كلمة المرور');
    input.focus();
  });
  input.addEventListener('input',function(){error.textContent='';gate.classList.remove('failed')});
  // A fresh page load always requires the password. Game progress remains saved normally.
  requestAnimationFrame(function(){input.focus()});
})();
</script>

const MYSTERY_MAP=Object.fromEntries(MYSTERY_CHALLENGES.map(c=>[c.id,c]));
function emptyMystery(){return {records:[],pending:null,drawnCards:[]}}
function normalizeMysteryDeck(m){
 if(!Array.isArray(m.drawnCards)){
  // Upgrade saved games from earlier editions: reconstruct the latest cycle where possible.
  const prior=[];
  for(const r of m.records||[]){const id=r.challengeId;if(!MYSTERY_MAP[id])continue;if(prior.includes(id)||prior.length>=MYSTERY_CHALLENGES.length)prior.length=0;prior.push(id)}
  const pendingId=m.pending?.challengeId;
  if(MYSTERY_MAP[pendingId]&&!prior.includes(pendingId)){if(prior.length>=MYSTERY_CHALLENGES.length)prior.length=0;prior.push(pendingId)}
  m.drawnCards=prior;
 }
 m.drawnCards=[...new Set(m.drawnCards.filter(id=>typeof id==='string'&&MYSTERY_MAP[id]))];
 return m;
}

function restoreGame(){try{const raw=localStorage.getItem(STORE_KEY);if(!raw)return null;const s=JSON.parse(raw);if(s.version!==1||!Array.isArray(s.teams)||!s.used||typeof s.used!=='object')return null;s.teams=s.teams.filter(t=>t&&typeof t.name==='string'&&Number.isFinite(t.score)).slice(0,10);s.history=Array.isArray(s.history)?s.history:[];if(!s.mystery||!Array.isArray(s.mystery.records))s.mystery=emptyMystery();if(!s.mystery.pending)s.mystery.pending=null;s.mystery.records=s.mystery.records.filter(r=>r&&s.teams.some(t=>t.id===r.teamId)&&MYSTERY_MAP[r.challengeId]&&Number.isFinite(r.points));normalizeMysteryDeck(s.mystery);if(s.mystery.pending&&(!s.teams.some(t=>t.id===s.mystery.pending.teamId)))s.mystery.pending=null;if(s.mystery.pending&&!['pick','shuffle','challenge','redraw'].includes(s.mystery.pending.phase))s.mystery.pending=null;if(s.mystery.pending&&s.mystery.pending.phase==='shuffle')s.mystery.pending.phase='pick';s.timerSec=TIMER_OPTIONS.includes(s.timerSec)?s.timerSec:30;s.points=[1,5,10].includes(s.points)?s.points:1;if(s.current&&!QUESTION_MAP[s.current.qid])s.current=null;if(s.current&&['revealed','expired'].includes(s.current.phase)){delete s.used[s.current.qid];s.current=null;s.screen='board'}if(s.current&&s.current.phase==='scored'){const u=s.used[s.current.qid];const h=s.history.find(x=>x.qid===s.current.qid);if(u){s.current.correct=u.result==='correct';s.current.givenPoints=u.score||0;s.current.choiceIndex=u.choiceIndex??h?.choiceIndex??null;s.current.timedOut=!!(u.timedOut??h?.timedOut);}}if(s.screen==='question'&&!s.current)s.screen='board';if(!['setup','board','question','result','final'].includes(s.screen))s.screen='board';return s}catch(e){return null}}

function replaceFlagEmojis(root=document.body){if(!root)return;const skip=new Set(['SCRIPT','STYLE','TEXTAREA','INPUT']);const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(node){if(!node.nodeValue||!node.nodeValue.includes('🇴🇲'))return NodeFilter.FILTER_REJECT;const p=node.parentNode;if(!p||skip.has(p.nodeName)||p.closest('.oman-flag'))return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT}});const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const node of nodes){const parts=node.nodeValue.split('🇴🇲');const frag=document.createDocumentFragment();parts.forEach((part,i)=>{if(part)frag.appendChild(document.createTextNode(part));if(i<parts.length-1){const tpl=document.createElement('template');tpl.innerHTML=OMAN_FLAG_MARKUP;frag.appendChild(tpl.content.firstChild)}});node.parentNode.replaceChild(frag,node)}}

function render(){if(state.current&&state.current.phase==='asking'&&Date.now()>=state.current.deadline)gradeAnswer(null);const view=state.screen==='setup'?setup():state.screen==='board'?board():state.screen==='question'?questionScreen():state.screen==='result'?resultScreen():state.screen==='final'?finalScreen():setup();document.querySelector('#app').innerHTML=header()+view+footer();document.querySelector('#modal-root').innerHTML=modalHtml();document.title=`راية المجد | ${state.screen==='board'?'لوحة الأسئلة':state.screen==='question'?'سؤال مباشر':'تحدّي عُمان'}`;replaceFlagEmojis(document.body);if(state.screen==='question')updateTimer()}
function showToast(msg){const el=document.querySelector('#toast');if(!el)return;el.textContent=msg;replaceFlagEmojis(el);el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3300)}
function closeModal(){ui.modal=null;ui.mysteryResult=null;ui.selectedQuestion=null;render()}
function updateTimer(){if(!state.current||state.current.phase!=='asking')return;const remain=Math.max(0,Math.ceil((state.current.deadline-Date.now())/1000));if(remain<=0){gradeAnswer(null);if(state.screen==='question')render();else{persist();render()}showToast('⏰ انتهى الوقت — سُجّل السؤال دون نقاط');return}if(state.screen!=='question')return;const n=document.getElementById('timer-number'),b=document.getElementById('timer-bar'),c=document.getElementById('timer-circle');if(n)n.textContent=num(remain);if(b)b.style.strokeDashoffset=377*(1-Math.min(1,remain/state.current.seconds));if(c)c.classList.toggle('danger',remain<=10)}
function validateNames(list){const clean=list.map(s=>String(s).trim().replace(/\s+/g,' ').slice(0,28));if(clean.some(x=>!x)){showToast('اكتب اسمًا لكل فريق.');return null}if(new Set(clean).size!==clean.length){showToast('يجب أن تكون أسماء الفرق مختلفة.');return null}return clean}
function startGame(){const count=ui.draft.count;const inputs=[...document.querySelectorAll('#teams-grid .team-name-input')];const names=validateNames(inputs.map(x=>x.value));if(!names)return;state=freshGame();state.teams=names.map((name,i)=>({id:'team-'+(i+1),order:i,name,score:0}));state.count=count;state.timerSec=Number(document.querySelector('#setup-timer').value);state.points=Number(document.querySelector('#setup-points').value);state.screen='board';persist();render();window.scrollTo({top:0,behavior:'instant'});showToast('🇴🇲 حُفظت الفرق — لتبدأ المنافسة!')}
function openAddTeam(){if(state.screen==='setup')return;if(state.teams.length>=10){showToast('الحد الأقصى هو عشرة فرق');return}if(state.current?.phase==='asking'){showToast('أنهِ السؤال الجاري أولًا ثم أضف الفريق من اللوحة');return}if(mysteryData().pending){showToast('احسم تحدّي صندوق المفاجآت أولًا ثم أضف الفريق');return}ui.modal='add-team';render();document.getElementById('new-team-name')?.focus()}
function addTeam(){if(state.screen==='setup'||state.teams.length>=10){showToast('لا يمكن إضافة أكثر من عشرة فرق');return}if(state.current?.phase==='asking'||mysteryData().pending){showToast('أكمل الجولة الحالية قبل إضافة فريق');return}const entry=document.getElementById('new-team-name');if(!entry)return;const checked=validateNames([...state.teams.map(t=>t.name),entry.value]);if(!checked)return;const id=Array.from({length:10},(_,i)=>'team-'+(i+1)).find(candidate=>!findTeam(candidate));if(!id){showToast('الحد الأقصى هو عشرة فرق');return}const name=checked.at(-1);state.teams.push({id,order:state.teams.length,name,score:0});state.count=state.teams.length;state.momentum=null;ui.modal=null;if(state.screen==='final')state.screen='board';persist();render();showToast('✅ أُضيف الفريق «'+name+'» بنجاح — تبدأ نقاطه من الصفر')}
function beginQuestion(qid,teamId){if(state.current&&state.current.phase!=='scored'){showToast('أكمل السؤال الجاري أولًا');return}if(state.used[qid]||!QUESTION_MAP[qid]||!findTeam(teamId))return;const startedAt=Date.now();state.used[qid]={teamId,result:null,score:0};state.current={qid,teamId,phase:'asking',deadline:startedAt+state.timerSec*1000,seconds:state.timerSec,points:state.points,startedAt};state.screen='question';ui.modal=null;ui.selectedQuestion=null;persist();render();window.scrollTo({top:0,behavior:'smooth'})}
function gradeAnswer(choiceIndex){const t=state.current;if(!t||t.phase!=='asking')return false;const q=QUESTION_MAP[t.qid],u=state.used[t.qid];if(!q||!u||u.result!==null)return false;const expired=Date.now()>=t.deadline;const answer=expired?null:choiceIndex;if(answer!==null&&(!Number.isInteger(answer)||answer<0||answer>3))return false;const correct=answer===q.correctIndex;clearTimeout(toastTimer);document.getElementById('toast')?.classList.remove('show');const points=correct?t.points:0;u.result=correct?'correct':'wrong';u.score=points;u.choiceIndex=answer;u.timedOut=answer===null;u.gradedAt=Date.now();const team=findTeam(t.teamId);const rankBefore=previousRanks();if(team)team.score+=points;if(points)noteRankChange(team.id,rankBefore);state.history.push({qid:t.qid,teamId:t.teamId,points,correct,choiceIndex:answer,timedOut:answer===null,at:u.gradedAt});t.phase='scored';t.correct=correct;t.choiceIndex=answer;t.timedOut=answer===null;t.givenPoints=points;state.screen='result';persist();if(correct)confetti();return true}
function goBoard(){state.screen='board';if(state.current?.phase==='scored')state.current=null;persist();ui.modal=null;render();window.scrollTo({top:0,behavior:'smooth'})}
function confetti(){const root=document.getElementById('confetti');root.innerHTML='';const colors=['#a02e3c','#f7f3e8','#12634b','#d7ac62'];for(let i=0;i<75;i++){const el=document.createElement('i');el.style.left=(Math.random()*100)+'%';el.style.background=colors[i%colors.length];el.style.animationDuration=(2+Math.random()*1.5)+'s';el.style.animationDelay=(Math.random()*.4)+'s';el.style.setProperty('--drift',((Math.random()-.5)*280)+'px');root.appendChild(el)}setTimeout(()=>{root.innerHTML=''},4000)}
function openMystery(){if(state.screen==='setup')return;if(state.current?.phase==='asking'){showToast('أنهِ السؤال الجاري أولاً');return}if(mysteryData().pending){ui.modal='mystery-reveal';render();return}ui.mysteryResult=null;ui.modal='mystery-choose';render()}
function shuffledCards(exclude=[]){
 const m=mysteryData();
 // Start a fresh 21-card cycle only after every card was selected once.
 if(m.drawnCards.length>=MYSTERY_CHALLENGES.length)m.drawnCards=[];
 const arr=MYSTERY_CHALLENGES.map(c=>c.id).filter(id=>!m.drawnCards.includes(id)&&!exclude.includes(id));
 // Free redraw when the final available card was the redraw itself starts a new cycle.
 if(!arr.length&&exclude.length){m.drawnCards=[];arr.push(...MYSTERY_CHALLENGES.map(c=>c.id).filter(id=>!exclude.includes(id)))}
 for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
 return arr.slice(0,8);
}
function chooseMysteryTeam(teamId){if(mysteryData().pending||!findTeam(teamId))return;const pending={teamId,phase:'shuffle',cards:shuffledCards(),chosenAt:Date.now()};mysteryData().pending=pending;persist();ui.modal='mystery-reveal';render();setTimeout(()=>{if(mysteryData().pending===pending&&pending.phase==='shuffle'){pending.phase='pick';persist();if(ui.modal==='mystery-reveal')render()}},2000)}
function pickMysteryCard(index){const p=mysteryData().pending;if(!p||p.phase!=='pick'||!Number.isInteger(index)||index<0||index>=p.cards.length)return;p.challengeId=p.cards[index];const c=MYSTERY_MAP[p.challengeId];if(!c)return;const deck=mysteryData();if(deck.drawnCards.includes(p.challengeId))return;deck.drawnCards.push(p.challengeId);persist();if(c.type==='instant'){settleMystery(c.points,c.points>0?'won':'penalty');return}if(c.type==='leader'){const sorted=scoreSort();const highest=sorted[0]?.score??0;const contenders=sorted.filter(t=>t.score===highest);const recipient=contenders.find(t=>t.id===p.teamId)||contenders[0];settleMystery(2,'won',recipient?.id);return}if(c.type==='redraw'){p.phase='redraw';persist();render();return}p.phase='challenge';p.deadline=Date.now()+20000;persist();render()}
function redrawMystery(){const p=mysteryData().pending;if(!p||p.phase!=='redraw'||p.challengeId!=='free-redraw')return;p.cards=shuffledCards(['free-redraw']);p.challengeId=null;p.deadline=0;p.phase='shuffle';persist();render();setTimeout(()=>{if(mysteryData().pending===p&&p.phase==='shuffle'){p.phase='pick';persist();if(ui.modal==='mystery-reveal')render()}},2000)}
function settleMystery(points,result,recipientId=null){const m=mysteryData(),p=m.pending;if(!p||!findTeam(p.teamId)||p.phase==='shuffle'||p.phase==='redraw')return;const c=MYSTERY_MAP[p.challengeId];if(!c||p.phase==='pick'&&!['instant','leader'].includes(c.type)||p.phase==='challenge'&&c.type!=='challenge')return;const team=findTeam(recipientId||p.teamId);if(!team)return;const before=previousRanks();m.records.push({id:'mystery-'+Date.now()+'-'+m.records.length,teamId:team.id,drawnBy:p.teamId,challengeId:p.challengeId,result,points,at:Date.now()});m.pending=null;team.score+=points;if(points!==0)noteRankChange(team.id,before);ui.mysteryResult={team:team.name,emoji:c.emoji,detail:c.type==='leader'?`هدية المتصدر: حصل فريق ${team.name} على نقطتين إضافيتين.`:c.detail,points};ui.modal='mystery-reveal';persist();render();if(points>0)confetti();showToast(`🎁 ${team.name}: ${points>0?'+':''}${num(points)} نقطة`)}
function decideMystery(won){const p=mysteryData().pending;if(!p||p.phase!=='challenge')return;settleMystery(won?2:0,won?'won':'missed')}
function updateMysteryTimer(){const p=mysteryData().pending;if(!p||p.phase!=='challenge')return;const n=Math.max(0,Math.ceil((p.deadline-Date.now())/1000));if(n<=0){settleMystery(0,'timeout');showToast('⏱️ انتهت 20 ثانية، دون نقاط');return}const el=document.getElementById('mystery-seconds'),clock=document.getElementById('mystery-clock');if(el)el.textContent=num(n);if(clock)clock.classList.toggle('danger',n<=5)}
function lastAward(){return mysteryData().records.at(-1)}
function undoLast(){const quiz=state.history.at(-1),bonus=lastAward();if(!quiz&&!bonus)return;const isBonus=bonus&&(!quiz||bonus.at>=quiz.at);if(!confirm(isBonus?'التراجع عن آخر نتيجة صندوق المفاجآت؟ سيُلغى أثر النقاط على الفريق.':'التراجع عن آخر تقييم وإعادة إتاحة ذلك السؤال؟'))return;if(isBonus){const item=mysteryData().records.pop(),t=findTeam(item.teamId);if(t)t.score-=item.points;showToast('↶ أُلغيت نتيجة صندوق المفاجآت')}else{const item=state.history.pop(),t=findTeam(item.teamId);if(t)t.score-=item.points;delete state.used[item.qid];if(state.current?.qid===item.qid)state.current=null;showToast('↶ أُلغيَ آخر تقييم، والسؤال متاح مجددًا')}state.momentum=null;state.screen='board';ui.modal=null;persist();render()}
function downloadBackup(){const blob=new Blob([JSON.stringify({format:'oman-quiz-backup-v1',exportedAt:new Date().toISOString(),game:state},null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='oman-national-day-quiz-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function resetRound(){if(!confirm('بدء جولة جديدة بنفس الفرق؟ ستُصفّر النقاط والأسئلة المستخدمة. يُفضّل تصدير نسخة احتياطية أولاً.'))return;state.teams.forEach(t=>t.score=0);state.used={};state.current=null;state.history=[];state.mystery=emptyMystery();state.momentum=null;state.screen='board';ui.modal=null;persist();render();showToast('بدأت جولة جديدة')}
function resetSetup(){if(!confirm('هل تريد إعادة إعداد اللعبة؟ ستُحذف النقاط والأسئلة المستخدمة على هذا المتصفح.'))return;const names=state.teams.map(t=>t.name);ui.draft={count:Math.max(2,Math.min(10,names.length||4)),names:names.length?names:['الفريق الأول','الفريق الثاني','الفريق الثالث','الفريق الرابع'],timerSec:state.timerSec,points:state.points};state=freshGame();state.screen='setup';ui.modal=null;persist();render()}
function namesForSettings(){return [...document.querySelectorAll('#settings-team-names .team-name-input')].map(i=>i.value)}
function saveSettings(){const names=validateNames(namesForSettings());if(!names)return;state.teams.forEach((t,i)=>t.name=names[i]);state.timerSec=Number(document.getElementById('settings-timer').value);state.points=Number(document.getElementById('settings-points').value);ui.modal=null;persist();render();showToast('حُفظت التعديلات')}
function handleAction(button){const action=button.dataset.action;switch(action){case 'fullscreen':{if(document.fullscreenElement){document.exitFullscreen?.()}else{document.documentElement.requestFullscreen?.().catch(()=>showToast('ملء الشاشة غير متاح في هذا المتصفح'))}break}
case 'save-setup':startGame();break;
case 'add-team':openAddTeam();break;
case 'mystery-open':openMystery();break;
case 'mystery-team':chooseMysteryTeam(button.dataset.teamid);break;
case 'mystery-win':decideMystery(true);break;
case 'mystery-lose':decideMystery(false);break;
case 'mystery-pick-card':pickMysteryCard(Number(button.dataset.index));break;
case 'mystery-redraw':redrawMystery();break;
case 'mystery-close':ui.mysteryResult=null;ui.modal=null;state.screen='board';render();break;
case 'pick-question':{if(mysteryData().pending){showToast('احسم تحدّي صندوق المفاجآت أولًا');return}if(state.current&&state.current.phase!=='scored'){showToast('أكمل السؤال الجاري أو ألغِه قبل بدء سؤال آخر');return}const qid=button.dataset.qid;if(state.used[qid]||!QUESTION_MAP[qid])return;ui.selectedQuestion=qid;ui.modal='choose';render();break}
case 'choose-team':if(!mysteryData().pending)beginQuestion(ui.selectedQuestion,button.dataset.teamid);break;
case 'close-modal':closeModal();break;
case 'resume':state.screen='question';persist();render();break;
case 'board':goBoard();break;



case 'answer-choice':if(gradeAnswer(Number(button.dataset.index)))render();break;
case 'finish-question':goBoard();break;
case 'cancel-question':{if(!state.current)return;if(!confirm('إلغاء السؤال دون احتساب نقاط؟ سيعود رقم السؤال متاحًا في اللوحة.'))return;delete state.used[state.current.qid];state.current=null;state.screen='board';persist();render();break}
case 'settings':ui.modal='settings';render();break;
case 'save-settings':saveSettings();break;
case 'undo':undoLast();break;
case 'final':state.screen='final';ui.modal=null;persist();render();break;
case 'new-round':resetRound();break;
case 'reset-setup':resetSetup();break;
case 'export':downloadBackup();break;
case 'import':document.getElementById('import-file').click();break;
}}
document.body.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(t){e.preventDefault();handleAction(t)}});
document.body.addEventListener('submit',e=>{if(e.target.id==='add-team-form'){e.preventDefault();addTeam()}});
document.body.addEventListener('input',e=>{if(e.target.id==='team-count'){const visible=[...document.querySelectorAll('#teams-grid input')].map(x=>x.value);ui.draft.names=[...visible,...ui.draft.names.slice(visible.length)];ui.draft.count=Number(e.target.value);while(ui.draft.names.length<ui.draft.count)ui.draft.names.push('الفريق '+num(ui.draft.names.length+1));document.getElementById('count-bubble').textContent=num(ui.draft.count);document.getElementById('teams-grid').innerHTML=inputNames(ui.draft.names,ui.draft.count)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){closeModal()}});
function validatedBackup(raw){
 if(!raw||raw.format!=='oman-quiz-backup-v1'||!raw.game||raw.game.version!==1)throw Error('Invalid backup format');
 const g=raw.game;
 if(!Array.isArray(g.teams)||g.teams.length<2||g.teams.length>10||!Array.isArray(g.history)||!g.used||typeof g.used!=='object'||Array.isArray(g.used))throw Error('Invalid game data');
 const teams=g.teams.map((t,i)=>{const name=String(t?.name??'').trim().replace(/\s+/g,' ').slice(0,28);if(!name)throw Error('Empty team name');return{id:'team-'+(i+1),order:i,name,score:0}});
 if(new Set(teams.map(t=>t.name)).size!==teams.length)throw Error('Duplicate names');
 const teamsById=new Map(teams.map(t=>[t.id,t]));
 const used={};const history=[];
 if(g.history.length>QUIZ_DATA.questions.length)throw Error('Too many answers');
 for(const h of g.history){
  if(!h||!QUESTION_MAP[h.qid]||used[h.qid]||!teamsById.has(h.teamId)||typeof h.correct!=='boolean')throw Error('Invalid judgement');
  const points=Number(h.points);
  if(!Number.isInteger(points)||(h.correct?![1,5,10].includes(points):points!==0))throw Error('Invalid score');
  const source=g.used[h.qid];
  if(h.choiceIndex!==undefined&&h.choiceIndex!==null&&(!Number.isInteger(h.choiceIndex)||h.choiceIndex<0||h.choiceIndex>3||h.correct!==(h.choiceIndex===QUESTION_MAP[h.qid].correctIndex)))throw Error('Invalid chosen answer');
  if(h.choiceIndex===null&&h.correct&&h.timedOut)throw Error('Invalid timeout grading');
  if(!source||source.teamId!==h.teamId||source.result!==(h.correct?'correct':'wrong')||Number(source.score)!==points)throw Error('Score mismatch');
  used[h.qid]={teamId:h.teamId,result:h.correct?'correct':'wrong',score:points,choiceIndex:h.choiceIndex??null,timedOut:!!h.timedOut,gradedAt:Number(h.at)||Date.now()};
  teamsById.get(h.teamId).score+=points;
  history.push({qid:h.qid,teamId:h.teamId,points,correct:h.correct,choiceIndex:h.choiceIndex??null,timedOut:!!h.timedOut,at:Number(h.at)||Date.now()});
 }
 const timerSec=TIMER_OPTIONS.includes(g.timerSec)?g.timerSec:30;
 const points=[1,5,10].includes(g.points)?g.points:1;
 let current=null;
 const c=g.current;
 if(c&&QUESTION_MAP[c.qid]&&teamsById.has(c.teamId)&&!used[c.qid]&&g.used[c.qid]&&g.used[c.qid].teamId===c.teamId&&g.used[c.qid].result===null&&c.phase==='asking'){
  const seconds=Number(c.seconds);
  const deadline=Number(c.deadline);
  current={qid:c.qid,teamId:c.teamId,phase:c.phase,seconds:TIMER_OPTIONS.includes(seconds)||seconds===10?seconds:timerSec,points:[1,5,10].includes(c.points)?c.points:points,deadline:Number.isFinite(deadline)?deadline:Date.now(),startedAt:Number(c.startedAt)||Date.now()};
  /* overdue restored sessions are automatically graded on the next render */
  used[c.qid]={teamId:c.teamId,result:null,score:0};
 }
 const md=g.mystery||emptyMystery();
 if(!Array.isArray(md.records)||md.records.length>10000)throw Error('Invalid mystery history');
 const mystery={records:[],pending:null,drawnCards:Array.isArray(md.drawnCards)?md.drawnCards.slice():null};
 for(const r of md.records){
  if(!r||!teamsById.has(r.teamId)||!MYSTERY_MAP[r.challengeId]||!['won','missed','timeout','penalty'].includes(r.result)||Number(r.points)!==(r.result==='won'?2:r.result==='penalty'?-1:0))throw Error('Invalid bonus record');
  const at=Number.isFinite(Number(r.at))?Number(r.at):Date.now();
  const entry={id:String(r.id||'mystery-'+mystery.records.length),teamId:r.teamId,drawnBy:teamsById.has(r.drawnBy)?r.drawnBy:r.teamId,challengeId:r.challengeId,result:r.result,points:Number(r.points),at};
  mystery.records.push(entry);teamsById.get(r.teamId).score+=entry.points;
 }
 if(md.pending){const p=md.pending;if(!teamsById.has(p.teamId)||!['pick','shuffle','challenge','redraw'].includes(p.phase))throw Error('Invalid pending bonus');mystery.pending={teamId:p.teamId,phase:p.phase==='shuffle'?'pick':p.phase,cards:Array.isArray(p.cards)&&p.cards.length===8&&p.cards.every(id=>MYSTERY_MAP[id])?p.cards:shuffledCards(),challengeId:p.challengeId,deadline:Number(p.deadline)||0,chosenAt:Number(p.chosenAt)||Date.now()}}
 normalizeMysteryDeck(mystery);
 for(const id of Object.keys(g.used))if(QUESTION_MAP[id]&&!used[id]){if(g.used[id]?.result!==null)throw Error('Unmatched result')}
 return {version:1,screen:current?'question':'board',teams,count:teams.length,timerSec,points,used,current,history,mystery,momentum:null,createdAt:Number(g.createdAt)||Date.now()};
}
document.getElementById('import-file').addEventListener('change',async(e)=>{
 const file=e.target.files?.[0];if(!file)return;
 try{
  const raw=JSON.parse(await file.text());
  const loaded=validatedBackup(raw);
  if(!confirm('استيراد هذا الحفظ سيستبدل الجلسة الحالية. هل تريد المتابعة؟'))return;
  state=loaded;ui.modal=null;ui.selectedQuestion=null;persist();render();showToast('تم استيراد نسخة اللعبة بنجاح');
 }catch(err){console.warn('Backup validation failed',err);showToast('ملف الحفظ غير صالح أو بياناته غير متطابقة. لم تتغير الجلسة الحالية.')}finally{e.target.value=''}
});
// Save every judgement, question choice and setting change. Timers use real time, so they recover accurately after refresh.
setInterval(()=>{updateTimer();updateMysteryTimer()},200);
if(state.screen==='setup'&&state.teams.length>0){ui.draft={count:state.teams.length,names:state.teams.map(t=>t.name),timerSec:state.timerSec,points:state.points}}
replaceFlagEmojis(document.body);
render();
</script>
